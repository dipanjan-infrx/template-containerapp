# Issue Fix Bot — open an issue, get a PR.
# On every newly-opened issue: Claude Sonnet (hosted on Azure AI Foundry)
# proposes a minimal fix + test, the bot pushes a branch, runs pytest, opens a
# PR (ready for your approval), and keeps the issue updated with progress.
name: Issue Fix Bot

on:
  issues:
    types: [opened, reopened]   # reopened lets you retry a failed run

permissions:
  contents: write       # push the fix branch
  issues: write         # comment on the issue
  pull-requests: write  # open the PR

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Post "on it" comment
        id: thinking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh issue comment "${{ github.event.issue.number }}" \
            --body "🤖 **Issue Fix Bot is on it!** Analysing the issue and generating a fix with Claude (on Azure). I'll update this comment with the PR link and test results when done.")
          echo "id=${URL##*issuecomment-}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt anthropic pytest httpx

      - name: Generate fix via Azure Claude
        id: generate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ASKROMA_AZURE_CLAUDE_ENDPOINT: ${{ secrets.ASKROMA_AZURE_CLAUDE_ENDPOINT }}
          ASKROMA_AZURE_CLAUDE_API_KEY: ${{ secrets.ASKROMA_AZURE_CLAUDE_API_KEY }}
          ASKROMA_AZURE_CLAUDE_MODEL: ${{ secrets.ASKROMA_AZURE_CLAUDE_MODEL }}
        run: python scripts/issue_bot.py

      - name: Commit fix to a new branch
        id: branch
        run: |
          BRANCH="bot/fix-issue-${{ github.event.issue.number }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/ tests/ requirements.txt
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "bot: suggested fix for issue #${{ github.event.issue.number }}"
            git push origin "$BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          # pipefail so pytest's exit code propagates through the `tee` pipe —
          # otherwise tee (always 0) masks failures and we'd report "passed".
          set -o pipefail
          pytest tests/ -v --tb=short 2>&1 | tee test_results.txt

      - name: Open pull request
        id: pr
        if: steps.branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXPLANATION=$(cat bot_output/explanation.txt 2>/dev/null || echo "No explanation available.")
          TEST_TAIL=$(tail -15 test_results.txt 2>/dev/null || echo "(no test output)")
          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            STATUS="All tests passed ✅"
          else
            STATUS="Some tests failed ⚠️ — review before merging"
          fi
          {
            echo "Closes #${{ github.event.issue.number }}"
            echo ""
            echo "## What changed"
            echo "$EXPLANATION"
            echo ""
            echo "## Test results — $STATUS"
            echo '```'
            echo "$TEST_TAIL"
            echo '```'
            echo ""
            echo "> Auto-generated by the Issue Fix Bot for issue #${{ github.event.issue.number }}."
          } > pr_body.md
          PR_URL=$(gh pr create \
            --title "[Bot] Fix for issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" \
            --body-file pr_body.md --base main --head "${{ steps.branch.outputs.name }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Update the issue comment with the result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_URL="${{ steps.pr.outputs.url }}"
          EXPLANATION=$(cat bot_output/explanation.txt 2>/dev/null || echo "")
          if [ "${{ steps.pytest.outcome }}" = "success" ]; then STATUS="All tests passed ✅"; else STATUS="Some tests failed ⚠️"; fi
          if [ "${{ steps.generate.outcome }}" != "success" ]; then
            # The fix step crashed — be honest, don't claim "no change needed".
            BODY=$(printf '🤖 **Issue Fix Bot hit an error** generating a fix.\n\nSee the run log: %s\n\nIf this project was just created, the platform may still be finishing setup — **re-open this issue** in a minute to retry.' "$RUN_URL")
          elif [ -n "$PR_URL" ]; then
            BODY=$(printf '🤖 **Issue Fix Bot — done!**\n\n**PR:** %s\n**Tests:** %s\n\n%s\n\nReview the PR and merge if the fix looks right.' "$PR_URL" "$STATUS" "$EXPLANATION")
          else
            BODY=$(printf '🤖 **Issue Fix Bot — no code change needed.**\n\n%s' "${EXPLANATION:-The bot determined no code change was required.}")
          fi
          jq -n --arg body "$BODY" '{body: $body}' | \
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${{ steps.thinking.outputs.id }}" --input -
